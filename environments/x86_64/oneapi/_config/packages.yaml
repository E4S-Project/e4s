packages:
  all:
    target: [x86_64_v3]
    require:
    - '@:99999999'
    - 'target=x86_64_v3'
    providers:
      c: [intel-oneapi-compilers, gcc]
      cxx: [intel-oneapi-compilers, gcc]
      fortran: [intel-oneapi-compilers, gcc]
      blas: [openblas]
      tbb: [intel-tbb]
    variants: +mpi

  intel-oneapi-compilers:
    externals:
    - spec: intel-oneapi-compilers@2026.1.0
      prefix: /opt/intel/oneapi
      extra_attributes:
        compilers:
          c: /opt/intel/oneapi/compiler/2026.1/bin/icx
          cxx: /opt/intel/oneapi/compiler/2026.1/bin/icpx
          fortran: /opt/intel/oneapi/compiler/2026.1/bin/ifx
  gcc:
    externals:
    - spec: gcc@13.3.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran

  elfutils:
    variants: +bzip2 ~nls +xz
  hdf5:
    variants: +fortran +hl +shared
  libfabric:
    variants: fabrics=sockets,tcp,udp,rxm
  libunwind:
    variants: +pic +xz
  ncurses:
    variants: +termlib
  openblas:
    variants: threads=openmp
    require: 'cppflags="-O1" target=x86_64_v3 %oneapi'
  trilinos:
    variants: +amesos +amesos2 +anasazi +aztec +belos +boost +epetra +epetraext
      +ifpack +ifpack2 +intrepid +intrepid2 +isorropia +kokkos +ml +minitensor +muelu
      +nox +piro +phalanx +rol +rythmos +sacado +stk +shards +shylu +stokhos +stratimikos
      +teko +tempus +tpetra +trilinoscouplings +zoltan +zoltan2 +superlu-dist gotype=long_long
  xz:
    variants: +pic
  gcc-runtime:
    require: 'target=x86_64_v3 %gcc'
  binutils:
    variants: +ld +gold +headers +libiberty ~nls
  rust:
    require: 'target=x86_64_v3 %gcc' 
  bison:
    require: 'target=x86_64_v3 %gcc'
  raja:
    variants: +plugins
  paraview:
    variants: +qt +examples

  # externals
  python:
    prefer:
    - '@3.12.13'
    externals:
    - spec: python@3.12.13+bz2+crypt+ctypes+dbm+lzma+pyexpat+pythoncmd+readline+sqlite3+ssl+tkinter+uuid+zlib
      prefix: /opt/python/pkgs/python-3.12.13
  mpi:
    require: intel-oneapi-mpi
  intel-oneapi-mpi:
    buildable: false
    externals:
    - spec: intel-oneapi-mpi@2021.18.0
      prefix: /opt/intel/oneapi
      modules: [mpi/2021.18]
  intel-oneapi-mkl:
    prefer:
    - '@2026.0.0'
    externals:
    - spec: intel-oneapi-mkl@2026.1.0
      prefix: /opt/intel/oneapi
      modules: [mkl/2026.1]
  intel-oneapi-dpl:
    buildable: false
    externals:
    - spec: intel-oneapi-dpl@2022.12.0
      prefix: /opt/intel/oneapi
      modules: [dpl/2022.12]
  intel-oneapi-tbb:
    buildable: false
    externals:
    - spec: intel-oneapi-tbb@2023.1.0
      prefix: /opt/intel/oneapi
      modules: [tbb/2023.1]
  oneapi-igc:
    buildable: false
    externals:
    - spec: oneapi-igc@2.11.43-1146
      prefix: /usr