spack:
  include:
  - ../_config/packages.yaml

  view: false

  concretizer:
    reuse: false
    unify: false
  
  specs:
  - aml +level_zero
  - amrex +sycl
  - arborx +sycl ^kokkos +sycl +openmp
  - cabana +sycl ^kokkos +sycl +openmp
  - hpctoolkit +level_zero ^dyninst@13.0.0
  - kokkos +sycl +openmp
  - tau +mpi +opencl +python +level_zero +syscall +ittnotify +dyninst
  - upcxx +level_zero

