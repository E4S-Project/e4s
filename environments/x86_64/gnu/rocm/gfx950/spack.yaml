spack:
  include:
  - ../../_config/packages.yaml
  - ../_config/packages.yaml

  view: false

  concretizer:
    reuse: false
    unify: false
  
  specs:
  - amrex +rocm amdgpu_target=gfx950
  - arborx +rocm amdgpu_target=gfx950
  - caliper +rocm amdgpu_target=gfx950
  - chai tests=none +rocm amdgpu_target=gfx950
  - gasnet +rocm amdgpu_target=gfx950
  - heffte +rocm amdgpu_target=gfx950
  - hypre +rocm amdgpu_target=gfx950
  - kokkos +rocm amdgpu_target=gfx950
  - kokkos-fft device_backend=hipfft ^kokkos +rocm amdgpu_target=gfx950
  - kokkos-tools ^kokkos +rocm amdgpu_target=gfx950
  - legion +rocm amdgpu_target=gfx950
  - libceed +rocm amdgpu_target=gfx950
  - magma ~cuda +rocm amdgpu_target=gfx950
  - mfem +rocm amdgpu_target=gfx950
  - papi +rocm amdgpu_target=gfx950
  - petsc +metis +hdf5 +hypre +superlu-dist +rocm amdgpu_target=gfx950
  - raja ~openmp +rocm amdgpu_target=gfx950
  - slate +rocm amdgpu_target=gfx950
  - slepc +rocm amdgpu_target=gfx950 ^petsc +rocm amdgpu_target=gfx950
  - strumpack ~slate +rocm amdgpu_target=gfx950
  - sundials +rocm amdgpu_target=gfx950
  - superlu-dist +rocm amdgpu_target=gfx950
  - tasmanian ~openmp +rocm amdgpu_target=gfx950
  - umpire +rocm amdgpu_target=gfx950
  - upcxx +rocm amdgpu_target=gfx950

  # not installed:
  # - cabana +rocm amdgpu_target=gfx950 ^kokkos@5.2.2 +rocm amdgpu_target=gfx950 # Cannot satisfy 'kokkos@4.1:4.6'
  # - chapel +rocm amdgpu_target=gfx950
  # - cp2k +mpi +rocm amdgpu_target=gfx950          # cp2k-2025.2: https://github.com/spack/spack/issues/49544
  # - exago +mpi +python +raja +hiop +rocm amdgpu_target=gfx950 ~ipopt cxxflags="-Wno-error=non-pod-varargs" # hiop-1.2.0: LinAlg/hiopVectorHip.cpp:682:23: error: out-of-line definition of 'logBarrier_local' does not match any declaration in 'hiop::hiopVectorHip'
  # - fftx +rocm amdgpu_target=gfx950               # hipbackend.hpp:138:29: error: nomatching function for call to 'memset'
  # - ginkgo +rocm amdgpu_target=gfx950             # rocm version constrained, 7.2 not allowed
  # - hpx +rocm amdgpu_target=gfx950                # CMake Error at cmake/HPX_Message.cmake:51 (message): ERROR: HPX needs support for C++11 std::atomic
  # - lbann ~cuda +rocm amdgpu_target=gfx950        # rocm version constrained, 7.2 not allowed
  # - paraview ~examples ~qt +rocm amdgpu_target=gfx950 ^llvm~lldb~lld~libomptarget~polly~gold libunwind=none compiler-rt=none # kokkos-5.1.1: CMake Error at cmake/kokkos_functions.cmake:992 (message): The compiler for CXX can not consume flag(s) -fno-gpu-rdc -xhip --rocm-path=/opt/rocm-7.2.2 --offload-arch=gfx90a in combination with the CMAKE_CXX_FLAGS=.  Please check the given configuration.
  # - trilinos +amesos +amesos2 +anasazi +aztec +belos +boost +epetra +epetraext +ifpack ~ifpack2 +intrepid +intrepid2 +isorropia +kokkos +ml +minitensor +muelu +nox +piro +phalanx +rol +rythmos +sacado +stk +shards +shylu ~stokhos +stratimikos +teko +tempus +tpetra +trilinoscouplings +zoltan +zoltan2 +superlu-dist gotype=long_long +rocm amdgpu_target=gfx950
