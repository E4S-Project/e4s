spack:
  include:
  - ../_config/packages.yaml
  - ../../_config/packages.yaml

  view: false

  concretizer:
    reuse: false
    unify: false

  specs:
  - bricks +cuda
  - flux-core +cuda # You probably have to install the development version of the Python package for your distribution.  The exact name of this package varies among them.
  - hpctoolkit +cuda ^dyninst@13.0.0
  - papi +cuda
  - tau +mpi +python +cuda +syscall +ittnotify +julia +perfetto libunwind=none +dyninst ^intel-tbb@2022.3.0
  - tomcat
  - guacamole-client
  - guacamole-server +vnc +webp
