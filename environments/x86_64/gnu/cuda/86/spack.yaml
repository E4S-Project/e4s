spack:
  include:
  - ../_config/packages.yaml
  - ../../_config/packages.yaml

  view: false

  concretizer:
    reuse: false
    unify: false
  
  specs:
  - adios2 +mpi +hdf5 +campaign +python +xrootd +cuda cuda_arch=86
  - amrex +cuda cuda_arch=86
  - arborx +cuda cuda_arch=86
  - axom +cuda cuda_arch=86
  - cabana +cuda cuda_arch=86 ^kokkos +wrapper +cuda_lambda +cuda cuda_arch=86
  - caliper +cuda cuda_arch=86
  - chai tests=none +cuda cuda_arch=86 ^umpire ~shared
  - chapel +cuda cuda_arch=86 ^llvm targets=x86,nvptx
  - cusz +cuda cuda_arch=86
  - fftx +cuda cuda_arch=86
  - ginkgo +cuda cuda_arch=86
  - gromacs +cuda cuda_arch=86
  - heffte +cuda cuda_arch=86
  - hpx +cuda cuda_arch=86
  - hypre +cuda cuda_arch=86
  - kokkos +wrapper +cuda cuda_arch=86
  - kokkos-kernels +cuda cuda_arch=86 ^kokkos +wrapper +cuda cuda_arch=86
  - legion +cuda cuda_arch=86
  - libceed +cuda cuda_arch=86
  - libpressio +bitgrooming +bzip2 +fpzip +hdf5 +libdistributed +lua +openmp +python +sz +sz3 +unix +zfp +json +remote +netcdf +cusz +mgard +cuda cuda_arch=86 ^cusz +cuda cuda_arch=86  ^lua@5.4.8 
  - magma +cuda cuda_arch=86
  - mfem +cuda cuda_arch=86
  - mgard +serial +openmp +timing +unstructured +cuda cuda_arch=86
  - omega-h +cuda cuda_arch=86
  - parsec +cuda cuda_arch=86
  - petsc +cuda cuda_arch=86
  - raja +cuda cuda_arch=86
  - slate +cuda cuda_arch=86
  - slepc +cuda cuda_arch=86
  - strumpack ~slate +cuda cuda_arch=86
  - sundials +cuda cuda_arch=86
  - superlu-dist +cuda cuda_arch=86
  - tasmanian +cuda cuda_arch=86
  - trilinos +cuda cuda_arch=86
  - umpire ~shared +cuda cuda_arch=86
  - vtk-m +cuda cuda_arch=86
  - zfp +cuda cuda_arch=86

