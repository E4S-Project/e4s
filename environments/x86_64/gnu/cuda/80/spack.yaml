spack:
  include:
  - ../_config/packages.yaml
  - ../../_config/packages.yaml

  view: false

  concretizer:
    reuse: false
    unify: false
  
  specs:
  - adios2 +mpi +hdf5 +campaign +python +xrootd +cuda cuda_arch=80
  - amrex +cuda cuda_arch=80
  - arborx +cuda cuda_arch=80
  - axom +cuda cuda_arch=80
  - cabana +cuda cuda_arch=80 ^kokkos +wrapper +cuda_lambda +cuda cuda_arch=80
  - caliper +cuda cuda_arch=80
  - chai tests=none +cuda cuda_arch=80 ^umpire ~shared
  - chapel +cuda cuda_arch=80 ^llvm targets=x86,nvptx
  - cp2k smm=blas +mpi +cuda cuda_arch=80
  - cusz +cuda cuda_arch=80
  - fftx +cuda cuda_arch=80
  - ginkgo +cuda cuda_arch=80
  - gromacs +cuda cuda_arch=80
  - heffte +cuda cuda_arch=80
  - hpx +cuda cuda_arch=80
  - hypre +cuda cuda_arch=80
  - kokkos +wrapper +cuda cuda_arch=80
  - kokkos-kernels +cuda cuda_arch=80 ^kokkos +wrapper +cuda cuda_arch=80
  - legion +cuda cuda_arch=80
  - libceed +cuda cuda_arch=80
  - libpressio +bitgrooming +bzip2 +fpzip +hdf5 +libdistributed +lua +openmp +python +sz +sz3 +unix +zfp +json +remote +netcdf +cusz +mgard +cuda cuda_arch=80 ^cusz +cuda cuda_arch=80 ^lua@5.4.8 # inconsistent concretization of lua 5.3.6 vs 5.4.8
  - magma +cuda cuda_arch=80
  - mfem +cuda cuda_arch=80
  - mgard +serial +openmp +timing +unstructured +cuda cuda_arch=80
  - mgard +serial +openmp +timing +unstructured +cuda cuda_arch=80
  - omega-h +cuda cuda_arch=80
  - parsec +cuda cuda_arch=80
  - petsc +cuda cuda_arch=80
  - raja +cuda cuda_arch=80
  - slate +cuda cuda_arch=80
  - slepc +cuda cuda_arch=80
  - strumpack ~slate +cuda cuda_arch=80
  - sundials +cuda cuda_arch=80
  - superlu-dist +cuda cuda_arch=80
  - tasmanian +cuda cuda_arch=80
  - trilinos +cuda cuda_arch=80
  - umpire ~shared +cuda cuda_arch=80
  - vtk-m +cuda cuda_arch=80
  - zfp +cuda cuda_arch=80

