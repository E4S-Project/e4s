spack:
  include:
  - ../_config/packages.yaml
  - ../../_config/packages.yaml

  view: false

  concretizer:
    reuse: false
    unify: false
  
  specs:
  - flux-core +cuda
  - hpctoolkit +cuda ^dyninst@13.0.0
  - papi +cuda
  - tau +mpi +python +cuda +syscall +ittnotify +julia +perfetto libunwind=none +dyninst  ^intel-tbb@2022.3.0


  #Utility Packages.
  - tomcat
  #Doesn't work with our default openjdk@25 on aarch64
  - guacamole-client ^openjdk@21
  - guacamole-server +vnc +webp

  # not installed:
  # - bricks +cuda                    # VSBrick-cond.py-SVE512-8x8x8-8:622:11: error: 'svst1_u32' was not declared in this scope; did you mean 'vst1_u32'?
