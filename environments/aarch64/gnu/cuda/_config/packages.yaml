packages:
  cuda:
    buildable: false
    prefer:
    - '@12.9.1'
    externals:
    - spec: cuda@12.9.1
      prefix: /usr/local/cuda-12.9
  llvm:
    prefer:
    - '~lldb~lld~libomptarget~polly~gold'
    require:
    - 'build_type=MinSizeRel'
    - 'target=aarch64'
  libglx:
    require: mesa
  libllvm:
    require: llvm