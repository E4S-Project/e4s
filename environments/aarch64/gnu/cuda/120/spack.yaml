spack:
  include:
  - ../_config/packages.yaml
  - ../../_config/packages.yaml

  view: false

  concretizer:
    reuse: false
    unify: false
  
  specs:
  - adios2 +mpi +hdf5 +campaign +python +xrootd +cuda cuda_arch=120
  - amrex +cuda cuda_arch=120
  - arborx +cuda cuda_arch=120
  - axom +cuda cuda_arch=120
  # - caliper +cuda cuda_arch=120
  - chai tests=none +cuda cuda_arch=120 ^umpire ~shared
  - cusz +cuda cuda_arch=120
  - fftx +cuda cuda_arch=120
  - ginkgo +cuda cuda_arch=120
  - gromacs +cuda cuda_arch=120
  - heffte +cuda cuda_arch=120
  # - hpx +cuda cuda_arch=120
  - hypre +cuda cuda_arch=120
  - kokkos +wrapper +cuda cuda_arch=120
  - kokkos-kernels +cuda cuda_arch=120 ^kokkos +wrapper +cuda cuda_arch=120
  - libceed +cuda cuda_arch=120
  - libpressio +bitgrooming +bzip2 +fpzip +hdf5 +libdistributed +lua +openmp +python +sz +sz3 +unix +zfp +json +remote +netcdf ~cusz +mgard +cuda cuda_arch=120 ^py-numcodecs@0.12.1 # py-numcodecs-0.15.0: needs newer python>=3.11
  - magma +cuda cuda_arch=120
  - mgard +serial +openmp +timing +unstructured +cuda cuda_arch=120
  - omega-h +cuda cuda_arch=120
  - parsec +cuda cuda_arch=120
  - petsc +cuda cuda_arch=120
  - raja +cuda cuda_arch=120
  - slate +cuda cuda_arch=120
  - slepc +cuda cuda_arch=120
  - strumpack ~slate +cuda cuda_arch=120
  - sundials +cuda cuda_arch=120
  - superlu-dist +cuda cuda_arch=120
  - tasmanian +cuda cuda_arch=120
  - trilinos +cuda cuda_arch=120
  - umpire ~shared +cuda cuda_arch=120
  - vtk-m +cuda cuda_arch=120 target=aarch64
  - zfp +cuda cuda_arch=120

