---


workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
- .pre
- Build Runner Images
- Build GPU Images
- Build MPI Images
- Build Minimal Spack Images
- Build Minimal SIF
- Fetch Minimal SIF
- Spack Build Dotenv
- Build X86_64 Spack Env
- Build AARCH64 Spack Env
- Build PPC64LE Spack Env
- Status Checks
- Build Release Images
- Gatekeeper-1
- Docker Tests Dotenv
- Docker Tests
- Gatekeeper-2
- Build Release SIF
- Gatekeeper-3
- Fetch Release SIF
- SIF Tests
- Wrapup

variables:
  ARTIFACTS_REL_PATH: artifacts
  SPACK_TARGET: $[[ inputs.spack_target ]]
  CONTAINER_TARGET: $[[ inputs.container_target ]]
  DISABLE_X86_64: $[[ inputs.disable_x86_64 ]]
  DISABLE_AARCH64: $[[ inputs.disable_aarch64 ]]
  DISABLE_PPC64LE: $[[ inputs.disable_ppc64le ]]
  DISABLE_UBUNTU: $[[ inputs.disable_ubuntu ]]
  DISABLE_ROCKY: $[[ inputs.disable_rocky ]]
  DISABLE_ROCM: $[[ inputs.disable_rocm ]]
  DISABLE_ONEAPI: $[[ inputs.disable_oneapi ]]
  DISABLE_CUDA: $[[ inputs.disable_cuda ]]
  DISABLE_TESTS: $[[ inputs.disable_tests ]]
  DISABLE_ALL: $[[ inputs.disable_all ]]
  CI_RUNNER_IMAGE: ecpe4s/ubuntu24.04-runner-x86_64-gcc-13.3:1783207471


.common:
  image: $CI_RUNNER_IMAGE
  variables:
    DOWNLOAD_PATH: ~/downloads
    PRIVATE_DIR: $CI_PROJECT_DIR/.private
  artifacts:
    when: always
    paths:
    - $ARTIFACTS_REL_PATH 
    reports:
      dotenv: $CI_PROJECT_DIR/${CI_JOB_ID}.env
  before_script: 
  - mkdir -p $ARTIFACTS_REL_PATH
  - export ARTIFACTS=$(pwd)/$ARTIFACTS_REL_PATH
  - export AWS_ENDPOINT_URL_S3=$S3_ENDPOINT
  - mkdir -p $PRIVATE_DIR
  - . .ci/credential-helpers.sh
  - aws_env_to_aws_disk $PRIVATE_DIR
  - if [[ "$(arch)" == "ppc64le" ]]; then aws_env_to_minio_disk $PRIVATE_DIR; fi
  - clear_aws_env_credentials
  - export SIGNING_KEY=$PRIVATE_DIR/key.priv
  - base64 -d $SIGNING_KEY_PATH_B64 > $SIGNING_KEY
  - env | grep AWS
  - for ff in $(ls $ARTIFACTS/output-images/*.env); do echo . $ff && cat $ff && set -a && . $ff && set +a ; done
  - set -a && . vars.env && set +a
  after_script:
  - rm -rf $PRIVATE_DIR

.build-docker-image:
  script:
  - env | grep -e ^UBUNTU_ -e ^ROCKY_ | sort || true
  - cd container-images/$IMAGE_PATH
  - export SAVE_OUTPUT_REF=$ARTIFACTS/image-ref.txt
  - export FORCE_CACHED_LOCKFILE=true
  - export BUILDX_NO_DEFAULT_ATTESTATIONS=1 # needed for effective use of caching
  - ./build.sh $IMAGE_TARGET
  - export OUTPUT_IMAGE=$(cat $SAVE_OUTPUT_REF)
  - mkdir -p $ARTIFACTS/output-images
  - echo $IMAGE_LABEL=$OUTPUT_IMAGE | tee $ARTIFACTS/output-images/${IMAGE_LABEL}.env
  - echo $IMAGE_LABEL=$OUTPUT_IMAGE | tee $CI_PROJECT_DIR/${CI_JOB_ID}.env
  - export DOCKER_CONFIG=~/.docker-configs/${CI_JOB_ID} # prevent race condition if multiple jobs are using docker push/auth are running on same shell runner
  - docker login -u $(cat $REGISTRY_USERNAME_FILE) --password-stdin ${REGISTRY} < $REGISTRY_PASSWORD_FILE
  - docker push -q $OUTPUT_IMAGE || docker push -q $OUTPUT_IMAGE || docker push -q $OUTPUT_IMAGE
  - docker logout ${REGISTRY}
  - >
    [[ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]] && exit 0
  - cd $CI_PROJECT_DIR/.ci && ./upload-merge-request-image-refs.sh

.build-env:
  script:
  - >
    if [[ "$(arch)" == "aarch64" ]]; then
      f=/usr/local/cuda/targets/sbsa-linux/lib/stubs/libcuda.so && [[ -f $f ]] && ln -s $f ${f}.1 || true
      f=/usr/local/cuda/targets/sbsa-linux/lib/stubs/libnvidia-ml.so && [[ -f $f ]] && ln -s $f ${f}.1 || true
      echo /usr/local/cuda/targets/sbsa-linux/lib/stubs > /etc/ld.so.conf.d/cuda-stubs.conf
    elif [[ "$(arch)" == "x86_64" ]]; then
      f=/usr/local/cuda/targets/x86_64-linux/lib/stubs/libcuda.so && [[ -f $f ]] && ln -s $f ${f}.1 || true
      f=/usr/local/cuda/targets/x86_64-linux/lib/stubs/libnvidia-ml.so && [[ -f $f ]] && ln -s $f ${f}.1 || true
      echo /usr/local/cuda/targets/x86_64-linux/lib/stubs > /etc/ld.so.conf.d/cuda-stubs.conf
    elif [[ "$(arch)" == "ppc64le" ]]; then
      f=/usr/local/cuda/targets/ppc64le-linux/lib/stubs/libcuda.so && [[ -f $f ]] && ln -s $f ${f}.1 || true
      f=/usr/local/cuda/targets/ppc64le-linux/lib/stubs/libnvidia-ml.so && [[ -f $f ]] && ln -s $f ${f}.1 || true
      echo /usr/local/cuda/targets/ppc64le-linux/lib/stubs > /etc/ld.so.conf.d/cuda-stubs.conf
    fi
  - ldconfig -v &>/dev/null
  - cd environments
  - >
    if [[ -f /etc/rcfiles/runner.sh ]]; then
      . /etc/rcfiles/runner.sh
    fi
  - >
    if [[ -f /opt/intel/oneapi/setvars.sh ]]; then
      . /opt/intel/oneapi/setvars.sh
    fi
  - >
    if [[ -d /opt/intel/oneapi/modulefiles/ ]]; then
      module use /opt/intel/oneapi/modulefiles
    fi
  - ./build-env.sh $TARGET_ENV
  after_script:
  - if ! [[ -z "${PRIVATE_DIR+x}" ]] && [[ -d $PRIVATE_DIR ]]; then echo rm -rf $PRIVATE_DIR; fi
  - echo "jobstatus_${CI_JOB_NAME//-/_}=$CI_JOB_STATUS" | tee -a $ARTIFACTS_REL_PATH/jobstatus.env

.build-env-status-check:
  tags: [uoregon-e4s-project, x86_64-status-checker]
  script:
  - set -a && . $ARTIFACTS_REL_PATH/jobstatus.env && set +a
  - env | grep jobstatus_
  - |
    passed=true
    for vv in ${!jobstatus_*}; do
      if [[ "${!vv}" == "failed" ]]; then
        passed=false
        echo JOB FAILED: $(echo $vv | cut -d'_' -f2-)
      fi
    done
    if [[ "$passed" != "true" ]]; then
      exit 1
    fi

.build-sif-image:
  timeout: 2 hours
  script:
  - env | grep -e ^UBUNTU_ -e ^ROCKY_ | sort
  - export docker_image=${!SOURCE_IMAGE_LABEL}
  - iid=$(docker inspect --format '{{.Id}}' $docker_image | cut -d':' -f 2-)
  - export iid=${iid:0:8}
  - repowtag="${docker_image##*/}" 
  - export repo=$(echo $repowtag | cut -d':' -f1)
  - tag=$(echo $repowtag | cut -d':' -f 2-)
  - |
    if [[ "$tag" == *"-"* ]]; then
      tag=$(echo $tag | cut -d'-' -f1)
      export new_iid="${repo}-${tag}-${iid}"
    else
      export new_iid="${repo}-${iid}"
    fi
  - export tarfile=${new_iid}.tar
  - export OUTPUT_DIR=/data/e4s-ci
  - >
    if [[ ! -d $OUTPUT_DIR ]]; then
      OUTPUT_DIR=.
    else
      export SINGULARITY_CACHEDIR=$OUTPUT_DIR/singularity-cache
    fi
  - export OUTPUT_IMAGE=${new_iid}.sif
  - mkdir -p $ARTIFACTS_REL_PATH/output-images
  - echo $IMAGE_LABEL=$OUTPUT_IMAGE | tee $ARTIFACTS_REL_PATH/output-images/${IMAGE_LABEL}.env
  - echo $IMAGE_LABEL=$OUTPUT_IMAGE | tee $CI_PROJECT_DIR/${CI_JOB_ID}.env
  - export exists=0
  - |
    if [[ "$(arch)" == "ppc64le" ]]; then
      if mc stat s3/${S3_BUCKET}/${S3_PREFIX}/sifs/$OUTPUT_IMAGE; then
        echo Found image: s3/${S3_BUCKET}/${S3_PREFIX}/sifs/$OUTPUT_IMAGE
        echo Build not needed!
        exit 0
      fi
    else
      if aws s3 ls s3://${S3_BUCKET}/${S3_PREFIX}/sifs/$OUTPUT_IMAGE; then
        echo Found image: s3://${S3_BUCKET}/${S3_PREFIX}/sifs/$OUTPUT_IMAGE
        echo Build not needed!
        exit 0
      fi
    fi
  - docker pull -q $docker_image
  - docker save $docker_image -o $OUTPUT_DIR/$tarfile
  - singularity --silent build --force ${OUTPUT_DIR}/${OUTPUT_IMAGE} docker-archive://${OUTPUT_DIR}/${tarfile}
  - rm -f ${OUTPUT_DIR}/${tarfile}
  - >
    if [[ "$(arch)" == "ppc64le" ]]; then
      mc --quiet cp ${OUTPUT_DIR}/${OUTPUT_IMAGE} s3/${S3_BUCKET}/${S3_PREFIX}/sifs/
    else
      aws s3 cp --quiet ${OUTPUT_DIR}/${OUTPUT_IMAGE} s3://${S3_BUCKET}/${S3_PREFIX}/sifs/
    fi
  - rm -rf ${OUTPUT_DIR}/${OUTPUT_IMAGE}
  - >
    [[ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]] && exit 0
  - cd $CI_PROJECT_DIR/.ci && ./upload-merge-request-image-refs.sh

.fetch-sif:
  tags: [uoregon-e4s-project, sif-downloader]
  variables:
    DOTENV: $CI_PROJECT_DIR/${CI_JOB_ID}.env
  artifacts:
    when: always
    paths:
    - $ARTIFACTS_REL_PATH
    reports: 
      dotenv: $CI_PROJECT_DIR/${CI_JOB_ID}.env
  script:
  - >
    env | grep $IMAGE_LABEL || "WARNING: Missing $IMAGE_LABEL from this pipeline, falling back to image-refs.env"
  - set -a && . image-refs.env && set +a
  - env | grep $IMAGE_LABEL
  - env | grep -e ^UBUNTU_ -e ^ROCKY_ | sort | tee $DOTENV
  - export SIF=${!IMAGE_LABEL}
  - export SIF_URL=${S3_ENDPOINT}/${S3_BUCKET}/${S3_PREFIX}/sifs/${SIF}
  - export DOWNLOAD_PATH=~/images/ci/${SIF}
  - >
    if [[ -f $DOWNLOAD_PATH ]]; then echo "SIF already fetched: $DOWNLOAD_PATH" && exit 0 ; fi
  - wget --quiet -O ~/images/ci/${SIF} -c $SIF_URL

.fetch-minimal-sif:
  extends: [.fetch-sif]
  stage: Fetch Minimal SIF

.fetch-release-sif:
  extends: [.fetch-sif]
  stage: Fetch Release SIF

.run-docker-tests:
  stage: Docker Tests
  script:
  - >
    if [[ -f /etc/bashrc ]]; then
      PS1=ci . /etc/bashrc
    elif [[ -f /etc/bash.bashrc ]]; then
      PS1=ci . /etc/bash.bashrc
    fi
  - cd testing
  - ./run-tests.sh $TEST_TARGET

.run-sif-tests:
  stage: SIF Tests
  script:
  - cd testing
  - ./run-sif-tests.sh $SIF $TEST_TARGET
  


get-s3-credentials:
  stage: .pre
  image: $CI_RUNNER_IMAGE
  tags: [uoregon-e4s-project, x86_64, docker]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: 0a7421ace6e98b2ff2715e93f3c04a7d9fa703296f4bd897908e1ac82c22ef17
  artifacts:
    when: always
    paths:
    - $ARTIFACTS_REL_PATH 
    reports: 
      dotenv: $CI_PROJECT_DIR/s3-creds.env
  script:
  - env | grep S3_
  - unset AWS_CONFIG_FILE
  - export AWS_ENDPOINT_URL_STS=https://uo-spack-mirror.e4s.io:9002
  - >
    if [[ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]]; then
      policy_file_in=$CI_PROJECT_DIR/.ci/merge-request-policy.json
    else
      policy_file_in=$CI_PROJECT_DIR/.ci/main-policy.json
    fi
  - policy=$CI_PROJECT_DIR/policy.json
  - envsubst '$S3_BUCKET,$CI_MERGE_REQUEST_IID' <$policy_file_in >$policy
  - >
    aws_sts_output=$(aws sts assume-role-with-web-identity
    --role-arn arn:minio:iam:::role/ZM0mPWBxe-nLE6gPCGm8uu5IWmk
    --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
    --web-identity-token $GITLAB_OIDC_TOKEN
    --policy file://$policy
    --duration-seconds 64800
    --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
    --output text)
  - printf "AWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_SESSION_TOKEN=%s\n" $aws_sts_output >> $CI_PROJECT_DIR/s3-creds.env
  # - $(printf "export AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
  # - >
  #   [[ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]] && .ci/load-merge-request-image-refs.sh $ARTFIACTS/get-s3-credentials.env
  # # - . image-refs.env
  # # - for kk in $(grep -oP '^\s*export\s+\K[a-zA-Z_][a-zA-Z0-9_]*' image-refs.env); do echo $kk=${!kk} >> refs.env ; done
  # - cat $ARTFIACTS/get-s3-credentials.env


## RUNNER IMAGES
x86_64-ubuntu-runner:
  extends: [.common, .build-docker-image]
  variables:
    IMAGE_PATH: 1-runner/x86_64-ubuntu24.04-gcc-13.3
    IMAGE_LABEL: UBUNTU_X86_64_RUNNER_IMAGE
  tags: [uoregon-e4s-project, x86_64, shell]
  needs: [get-s3-credentials]
  stage: Build Runner Images
  timeout: 6 hours
  rules:
  - if: $DISABLE_X86_64 == "true"
    when: never
  - if: $DISABLE_UBUNTU == "true"
    when: never
  - if: $CONTAINER_TARGET =~ /container-all/
  - if: $CONTAINER_TARGET =~ /container-x86_64/
  - if: $CONTAINER_TARGET =~ /runner-all/
  - if: $CONTAINER_TARGET =~ /runner-x86_64/
  - if: $CONTAINER_TARGET =~ /runner-ubuntu/
  - if: $DISABLE_ALL == "true"
    when: never
  - if: $CI_PIPELINE_SOURCE == "push"
    changes:
    - vars.env
    - .gitlab-ci.yml
    - container-images/_common/**/*
    - container-images/1-runner/_common/**/*
    - container-images/1-runner/x86_64-ubuntu24.04-gcc-13.3/**/*
  - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == 'merge_request_event'
    changes:
      paths:
      - vars.env
      - .gitlab-ci.yml
      - container-images/_common/**/*
      - container-images/1-runner/_common/**/*
      - container-images/1-runner/x86_64-ubuntu24.04-gcc-13.3/**/*
      compare_to: 'refs/heads/main'


