    optional: true
  - job: ppc64le-ubuntu-release-cuda-70-sif
    optional: true
  rules:
  - if: $CONTAINER_TARGET != "build-nothing"
    when: manual
    allow_failure: false
  - if: $SPACK_TARGET != "build-nothing"
    when: manual
    allow_failure: false
  - if: $DISABLE_ALL == "true"
    when: never
  - if: $CI_PIPELINE_SOURCE == "push"
    when: manual
    allow_failure: false
    changes:
    - .gitlab-ci.yml
    - container-images/**/*
    - environments/**/*
    - vars.env
  - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == 'merge_request_event'
    when: manual
    allow_failure: false
    changes:
      paths:
      - .gitlab-ci.yml
      - container-images/**/*
      - environments/**/*
      - vars.env
      compare_to: 'refs/heads/main'
  script:
  - env | grep -e ^UBUNTU_ -e ^ROCKY_ | sort || true
  - cp image-refs.env image-refs.env.original
  - |
    for ff in $(env | grep -e ^UBUNTU_ -e ^ROCKY_ | sort); do
      kk=$(echo $ff | cut -d'=' -f1)
      vv=$(echo $ff | cut -d'=' -f 2- | rev | cut -d'/' -f1 | rev)
      if [[ "$kk" == *"_SIF" ]]; then
        sed -i 's|^export '$kk'=.*|export '$kk'=${'$kk':-'$vv'}|' image-refs.env
      else
        sed -i 's|^export '$kk'=.*|export '$kk'=${'$kk':-${REGISTRY}/'$vv'}|' image-refs.env
      fi
    done
  - >
    diff image-refs.env image-refs.env.original || true
  - cat image-refs.env | tee $ARTIFACTS_REL_PATH/image-refs.env
