## RELEASE IMAGES
x86_64-ubuntu-release-cpu:
  extends: [.common, .build-docker-image]
  variables:
    IMAGE_PATH: 5-release/x86_64-ubuntu24.04
    IMAGE_LABEL: UBUNTU_X86_64_RELEASE_CPU_IMAGE
    IMAGE_TARGET: cpu
  tags: [uoregon-e4s-project, x86_64, shell]
  needs:
  - get-s3-credentials
  - job: x86_64-ubuntu-runner
    optional: true
  - job: x86_64-ubuntu-cpu-mpi
    optional: true
  - job: x86_64-gnu-cpu-status
    optional: true
  stage: Build Release Images
  timeout: 6 hours
  rules: 
  - if: $DISABLE_X86_64 == "true"
    when: never
  - if: $DISABLE_UBUNTU == "true"
    when: never
  - if: $CONTAINER_TARGET =~ /container-all/
  - if: $CONTAINER_TARGET =~ /container-x86_64/
  - if: $CONTAINER_TARGET =~ /runner-all/
  - if: $CONTAINER_TARGET =~ /runner-x86_64/
  - if: $CONTAINER_TARGET =~ /runner-ubuntu/
  - if: $CONTAINER_TARGET =~ /mpi-all/
  - if: $CONTAINER_TARGET =~ /mpi-x86_64/
  - if: $CONTAINER_TARGET =~ /mpi-cpu/
  - if: $CONTAINER_TARGET =~ /mpi-ubuntu-cpu/
  - if: $CONTAINER_TARGET =~ /release-all/
  - if: $CONTAINER_TARGET =~ /release-ubuntu-all/
  - if: $CONTAINER_TARGET =~ /release-x86_64-all/
  - if: $CONTAINER_TARGET =~ /release-x86_64-ubuntu-all/
  - if: $CONTAINER_TARGET =~ /release-x86_64-ubuntu-cpu/
  - if: $SPACK_TARGET =~ /all-all/
  - if: $SPACK_TARGET =~ /x86_64-all/
  - if: $SPACK_TARGET =~ /x86_64-ubuntu-all/
  - if: $SPACK_TARGET =~ /x86_64-gnu-all/
  - if: $SPACK_TARGET =~ /x86_64-gnu-cpu/
  - if: $DISABLE_ALL == "true"
    when: never
  - if: $CI_PIPELINE_SOURCE == "push"
    changes:
    - vars.env
    - .gitlab-ci.yml
    - environments/build-env.sh
    - environments/x86_64/gnu/_config/**/*
    - environments/x86_64/gnu/cpu/**/*
    - container-images/_common/**/*
    - container-images/_common_4_5/**/*
